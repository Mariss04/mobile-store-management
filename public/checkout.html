<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout</title>
</head>

<body style="
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#f5f6fa;
">

<!-- NAVBAR -->
<div style="
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 28px;
  background:linear-gradient(135deg,#0d6efd,#0b5ed7);
  color:white;
">
  <div style="font-size:22px;font-weight:bold;">🛒 M$$ Store</div>
  <div>
    <a href="/index.html" style="color:white;margin-right:15px;text-decoration:none;">Home</a>
    <a href="/cart.html" style="color:white;text-decoration:none;">Cart</a>
  </div>
</div>

<h2 style="text-align:center;margin:20px 0;">Checkout</h2>

<!-- CONTAINER -->
<div style="
  display:flex;
  justify-content:center;
  gap:30px;
  flex-wrap:wrap;
  padding:20px;
">

  <!-- CUSTOMER DETAILS -->
  <div style="
    background:#ffffff;
    width:320px;
    padding:20px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.12);
  ">
    <h3 style="margin-bottom:15px;">Customer Details</h3>

    <input id="name" placeholder="Full Name" style="
      width:100%;
      padding:10px;
      margin-bottom:12px;
      border-radius:6px;
      border:1px solid #ccc;
    ">

    <input id="phone" placeholder="Mobile Number" style="
      width:100%;
      padding:10px;
      margin-bottom:12px;
      border-radius:6px;
      border:1px solid #ccc;
    ">

    <textarea id="address" placeholder="Delivery Address" style="
      width:100%;
      padding:10px;
      height:80px;
      resize:none;
      border-radius:6px;
      border:1px solid #ccc;
    "></textarea>

    <p style="
      background:#f1f3f5;
      padding:10px;
      margin-top:12px;
      border-radius:6px;
      font-size:14px;
    ">
      <b>Payment:</b> Cash on Delivery
    </p>
  </div>

  <!-- ORDER SUMMARY -->
  <div style="
    background:#ffffff;
    width:320px;
    padding:20px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.12);
  ">
    <h3>Order Summary</h3>
    <div id="summary"></div>
    <h4 id="total" style="margin-top:15px;"></h4>
  </div>

</div>

<!-- PLACE ORDER -->
<div style="text-align:center;">
  <button id="orderBtn" onclick="placeOrder()" style="
    padding:14px 26px;
    font-size:16px;
    background:linear-gradient(135deg,#198754,#157347);
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
  ">
    Place Order
  </button>
</div>

<script>
// LOGIN CHECK (IMPORTANT)
// if (localStorage.getItem("adminLoggedIn") !== "true") {
//   alert("Please login to place order");
//   window.location.href = "/admin-login.html";
// }
// =======================

// LOAD ORDER SUMMARY
async function loadSummary() {
  const res = await fetch("/cart");
  const items = await res.json();

  const div = document.getElementById("summary");
  let total = 0;
  div.innerHTML = "";

  if (!items || items.length === 0) {
    div.innerHTML = "<p>Cart is empty</p>";
    document.getElementById("total").innerText = "";
    return;
  }

  items.forEach(p => {
    total += p.price * p.qty;
    div.innerHTML += `
      <p style="margin:6px 0;">
        ${p.name} × ${p.qty}
        <span style="float:right;">
          $${p.price * p.qty}
        </span>
      </p>
    `;
  });

  document.getElementById("total").innerText =
    "Total: $" + total;
}

loadSummary();

// PLACE ORDER
function placeOrder() {
  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const address = document.getElementById("address").value.trim();
  const btn = document.getElementById("orderBtn");

  if (!name || !phone || !address) {
    alert("Please fill all details");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Placing Order...";

  fetch("/checkout", { method: "POST" })
    .then(() => {
      window.location.href = "/order.html";
    })
    .catch(() => {
      alert("Order failed");
      btn.disabled = false;
      btn.innerText = "Place Order";
    });
}
</script>

</body>
</html>
